name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      # CI checks out only the cli repo; drop the local ../go replace and
      # resolve the published go-sdk module so vet/test/lint work.
      - name: Resolve published go-sdk
        run: |
          go mod edit -dropreplace=github.com/voicetel/go-sdk/v2
          go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "These files need gofmt:"; echo "$out"; exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
      - name: Test
        run: go test ./... -race -coverprofile=coverage.out
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Resolve published go-sdk
        run: |
          go mod edit -dropreplace=github.com/voicetel/go-sdk/v2
          go mod tidy
      - name: Build
        run: go build ./...
