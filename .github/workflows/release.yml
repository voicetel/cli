name: release

# Builds + publishes the voicetel-cli release artifacts when a v* tag is pushed.
# Delegates the build matrix to ./Makefile (`make release`) so the local
# `make release` and the CI release produce byte-identical archives.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # `make release` cross-compiles to 9 platforms and packages each as
      # tar.gz (darwin/linux/freebsd) or zip (windows). Output names:
      # voicetel-cli_<version>_<os>-<arch>{.tar.gz,.zip}
      - name: Build all platforms + package
        run: make release

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-upload archives (replaces existing) on retag / manual dispatch.
            gh release upload "$tag" dist/*.tar.gz dist/*.zip --clobber
          else
            gh release create "$tag" \
              --title "VoiceTel CLI $tag" \
              --generate-notes \
              dist/*.tar.gz dist/*.zip
          fi
